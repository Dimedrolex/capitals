<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Passport Quiz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg: var(--tg-theme-bg-color,#ffffff);
  --bg2: var(--tg-theme-secondary-bg-color,#f1f3f6);
  --text: var(--tg-theme-text-color,#111418);
  --hint: var(--tg-theme-hint-color,#8a8f98);
  --accent: var(--tg-theme-button-color,#2f7cf6);
  --accent-text: var(--tg-theme-button-text-color,#ffffff);
  --ok:#22a55a; --bad:#e5484d;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg: var(--tg-theme-bg-color,#16181c);
    --bg2: var(--tg-theme-secondary-bg-color,#23262c);
    --text: var(--tg-theme-text-color,#f2f3f5);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:inherit}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.screen{display:none}.screen.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
h1{font-size:24px;line-height:1.2}
.sub{color:var(--hint);font-size:14px;margin-top:4px}
.lang{display:flex;background:var(--bg2);border-radius:10px;padding:3px;flex-shrink:0}
.lang button{border:0;background:none;color:var(--hint);font-weight:700;padding:6px 10px;border-radius:8px;font-size:13px;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--accent-text)}
.card{background:var(--bg2);border-radius:16px;padding:14px;margin-bottom:12px}
.daily{display:block;width:100%;text-align:left;border:0;border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff8a00,#e52e71)}
.daily b{font-size:17px;display:block;margin-bottom:4px}.daily span{font-size:13px;opacity:.92}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--hint);margin:2px 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1.5px solid transparent;background:var(--bg);color:var(--text);padding:8px 12px;border-radius:20px;font-size:14px;cursor:pointer}
.chip small{color:var(--hint);font-size:11px;margin-left:2px}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.seg .chip{border-radius:12px;text-align:center;padding:11px 6px}
.best-line{font-size:13px;color:var(--hint)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-text);margin-bottom:10px}
.btn.sec{background:var(--bg2);color:var(--text)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:var(--hint)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--hint);margin-bottom:8px}
.bar{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q{text-align:center;margin:14px 0 22px}
.q small{color:var(--hint);font-size:14px;display:block;margin-top:10px}
.q h2{font-size:26px;margin-top:4px;line-height:1.25}
.fl{display:inline-block;line-height:1}
.fl img{display:block;border-radius:4px;object-fit:cover}
.fl.big{font-size:72px}.fl.big img{height:84px;width:auto;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.fl.sm{font-size:20px;vertical-align:middle}.fl.sm img{height:20px;width:30px}
.opts{display:grid;gap:10px}
.opt{border:0;background:var(--bg2);color:var(--text);padding:16px;border-radius:14px;font-size:17px;text-align:left;cursor:pointer;transition:transform .1s,background .15s}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--ok);color:#fff}
.opt.bad{background:var(--bad);color:#fff;animation:shake .3s}
.opt.gone{visibility:hidden}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.reveal{min-height:28px;text-align:center;margin-top:14px;font-size:15px;color:var(--hint)}
.tools{display:flex;justify-content:space-between;margin-top:8px}
.link{background:none;border:0;color:var(--accent);font-size:15px;font-weight:600;cursor:pointer;padding:8px}
.link:disabled{color:var(--hint);opacity:.5;cursor:default}
.big-score{font-size:60px;font-weight:800;text-align:center;line-height:1.1}
.pct{text-align:center;color:var(--hint);margin:6px 0 10px}
.badge{display:block;text-align:center;color:#ff8a00;font-weight:700;font-size:18px;margin-bottom:14px}
.emoji{font-size:56px;text-align:center;margin-top:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(128,128,128,.15);font-size:15px}
.item:last-child{border-bottom:0}
.item .c{margin-left:auto;color:var(--hint);text-align:right}
.search{width:100%;border:0;background:var(--bg2);color:var(--text);padding:13px 14px;border-radius:12px;font-size:16px;margin-bottom:12px;outline:none}
.hbtns{display:flex;gap:6px;align-items:center;flex-shrink:0}
.snd{border:0;background:var(--bg2);border-radius:10px;width:36px;height:34px;font-size:16px;cursor:pointer}
.opt.ok{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.05)}}
.praise{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);font-size:30px;font-weight:800;color:var(--ok);opacity:0;pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.18);white-space:nowrap;z-index:50}
.praise.mega{color:#ff8a00;font-size:38px}
.praise.go{animation:praise 1.1s ease-out forwards}
.praise.go2{animation:praise2 1.1s ease-out forwards}
.praise.go3{animation:praise3 1.15s ease-out forwards}
.praise.go4{animation:praise4 1.1s ease-out forwards}
@keyframes praise2{0%{opacity:0;transform:translate(-160%,-50%) rotate(-12deg)}25%{opacity:1;transform:translate(-45%,-50%) rotate(4deg)}40%{transform:translate(-50%,-50%) rotate(0)}75%{opacity:1}100%{opacity:0;transform:translate(60%,-50%)}}
@keyframes praise3{0%{opacity:0;transform:translate(-50%,-260%)}30%{opacity:1;transform:translate(-50%,-40%)}45%{transform:translate(-50%,-62%)}60%{transform:translate(-50%,-50%)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}}
@keyframes praise4{0%{opacity:0;transform:translate(-50%,-50%) rotate(-200deg) scale(.2)}35%{opacity:1;transform:translate(-50%,-50%) rotate(8deg) scale(1.15)}50%{transform:translate(-50%,-50%) rotate(0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
@keyframes praise{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}40%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
.cf{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:60;pointer-events:none;animation:fall var(--d) ease-in forwards}
.cf.round{width:11px;height:11px;border-radius:50%}
.cf.emo{width:auto;height:auto;background:none;font-size:22px}
.cf.burst{top:45%;left:50%;width:9px;height:9px;border-radius:50%;animation:burst var(--d) ease-out forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(calc(-50% + var(--bx)),calc(-50% + var(--by))) scale(.4);opacity:0}}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r))}}
/* --- справочник: глобус закреплён сверху, под ним обычный список (телефон, браузер, Telegram на ПК) --- */
#ref header{margin-bottom:4px}
#ref h1{font-size:20px}
.ref-globe{position:sticky;top:0;z-index:5;height:min(42vh,360px);margin:0 -16px 8px;background:var(--bg)}
.globe-box{position:absolute;inset:0;overflow:hidden;touch-action:none}
.ref-side .sel-card{display:none}
.ref-side .chips{margin-bottom:8px}
.ref-side .search{padding:11px 14px;margin-bottom:8px}
.tray{display:flex;flex-direction:column;background:var(--bg2);border-radius:16px;padding:6px 10px}
.tcard{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px;cursor:pointer;user-select:none;-webkit-user-select:none;border-bottom:1px solid rgba(128,128,128,.12)}
.tcard:last-child{border-bottom:0}
.tcard:hover{background:rgba(128,128,128,.08)}
.tcard .fl img{height:20px;width:30px}
.tcard b{flex:1;font-size:15px;font-weight:600}
.tcard span{font-size:14px;color:var(--hint);text-align:right}
.tcard.sel{background:rgba(255,138,0,.16)}
.tray-empty{color:var(--hint);padding:20px;text-align:center}
/* --- широкий экран: глобус слева, список справа --- */
@media (min-width:768px){
  .wrap.wide{max-width:1100px}
  .ref-layout{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
  .ref-globe{top:16px;height:calc(100vh - 90px);margin:0}
  .ref-side .sel-card{display:flex}
  .tray{overflow-y:auto;max-height:calc(100vh - 330px)}
}
.globe-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:14px;text-align:center;padding:20px}
.sel-card{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:14px;padding:12px;margin-bottom:12px;min-height:58px}
.fl.md img{height:30px;width:45px}
.pin{pointer-events:none;color:#fff;font-size:13px;white-space:nowrap;transform:translateY(-16px)}
.pin b{background:rgba(0,0,0,.6);padding:3px 8px;border-radius:10px}
.glabel{background:rgba(0,0,0,.78);color:#fff;padding:6px 10px;border-radius:8px;font-size:13px;line-height:1.4}
.item.clk{cursor:pointer}
.item.sel{background:rgba(255,138,0,.16);border-radius:10px;padding-left:8px;padding-right:8px}
.seg3{grid-template-columns:repeat(3,1fr)}
.seg3 .chip{font-size:13px;padding:10px 4px;line-height:1.25}
.type-hint{font-size:12px;color:var(--hint);margin:-6px 0 14px}
.rank{background:var(--bg2);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.rank-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:15px}
.rank-top em{display:block;font-style:normal;font-size:12px;color:var(--hint);margin-top:2px;font-weight:400}
.rank-top span{color:var(--hint);font-size:13px;font-weight:600}
.rank .bar{margin-bottom:6px;background:var(--bg)}
.rank .bar i{background:linear-gradient(90deg,#ffb100,#ff6a00)}
.rank small{color:var(--hint);font-size:12px}
.loading{text-align:center;color:var(--hint);padding:80px 20px;font-size:16px}
.shape{display:block;width:240px;height:170px;margin:0 auto 4px}
.shape path{fill:var(--accent);stroke:var(--accent);stroke-width:1.2px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hard{display:grid;gap:10px}
.hard input{width:100%;border:2px solid transparent;background:var(--bg2);color:var(--text);padding:16px;border-radius:14px;font-size:18px;outline:none}
.hard input:focus{border-color:var(--accent)}
.hard input.ok{border-color:var(--ok);background:rgba(34,165,90,.15)}
.hard input.bad{border-color:var(--bad);background:rgba(229,72,77,.12);animation:shake .3s}
.hard .btn{margin:0}
.hard-hint{text-align:center;color:#ff8a00;font-weight:600;min-height:20px;margin-top:8px;font-size:14px}
.praise.minus{color:var(--bad);font-size:34px}
#timerBar.low{background:var(--bad)}
.xp-line{text-align:center;font-weight:700;color:#ff8a00;margin-bottom:10px}
.ach-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.badge-card{background:var(--bg2);border-radius:14px;padding:12px;text-align:center;opacity:.5}
.badge-card.on{opacity:1;box-shadow:inset 0 0 0 2px rgba(255,138,0,.5)}
.badge-card .bi{font-size:34px;margin-bottom:4px}
.badge-card b{display:block;font-size:14px}
.badge-card small{display:block;font-size:12px;color:var(--hint);margin-top:2px}
.ach-row{display:flex;flex-wrap:wrap;gap:8px}
.ach-row span{background:var(--bg);border-radius:20px;padding:6px 10px;font-size:13px}
.ach-banner{position:fixed;left:50%;top:12px;transform:translate(-50%,-150%);display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#ffb100,#ff6a00);color:#fff;padding:10px 18px 10px 12px;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:70;transition:transform .35s cubic-bezier(.2,1.4,.4,1);max-width:92vw}
.ach-banner.show{transform:translate(-50%,0)}
.ach-banner .ai{font-size:32px}
.ach-banner small{display:block;font-size:11px;opacity:.9;text-transform:uppercase;letter-spacing:.04em}
.ach-banner b{font-size:16px}
.tier{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:4px;vertical-align:middle;background:rgba(34,165,90,.15);color:var(--ok)}
.tier.t15{background:rgba(255,177,0,.18);color:#d48a00}
.tier.t2{background:rgba(229,72,77,.15);color:var(--bad)}
.gain{color:#ff8a00;font-weight:700;white-space:nowrap}
#ref header{justify-content:flex-start;align-items:center}
.back{border:0;background:var(--bg2);color:var(--accent);font-weight:700;font-size:15px;padding:8px 12px;border-radius:10px;cursor:pointer;flex-shrink:0}
#ach header{justify-content:flex-start;align-items:center}
.daily.res{background:linear-gradient(135deg,#00b4db,#0083b0)}
#resorts header{justify-content:flex-start;align-items:center}
.rtype{color:var(--hint);font-size:13px;margin-top:2px}
.opt .fl.sm{margin-right:6px}
.daily.countries{background:linear-gradient(135deg,#667eea,#764ba2)}
#countries header{justify-content:flex-start;align-items:center}
.daily.kids{background:linear-gradient(135deg,#a18cd1,#f78fb3)}
.daily.kflag{background:linear-gradient(135deg,#ff9a44,#fc6076);padding:22px 16px}
.daily.kcap{background:linear-gradient(135deg,#43cea2,#185a9d);padding:22px 16px}
.daily.kflag b,.daily.kcap b{font-size:20px}
#kids header{justify-content:flex-start;align-items:center}
.fl.kid{font-size:90px}
.fl.kid img{height:120px;width:auto;border-radius:10px;box-shadow:0 3px 14px rgba(0,0,0,.2)}
.opts.kid{gap:12px}
.opts.kid .opt{font-size:20px;padding:20px;text-align:center;border-radius:18px;font-weight:600}
.opt.soft{opacity:.4}
.stars{font-size:58px;text-align:center;margin:10px 0 4px;letter-spacing:4px}
/* --- компьютер / браузер: игра в красивой «карточке» на фоне, ховеры, клавиатура --- */
@media (min-width:768px){
  body{background:
    radial-gradient(900px 520px at 12% -8%, rgba(46,197,232,.28), transparent 70%),
    radial-gradient(800px 480px at 105% 105%, rgba(118,75,162,.26), transparent 70%),
    radial-gradient(600px 400px at 90% 10%, rgba(255,138,0,.14), transparent 70%),
    var(--bg2)}
  .wrap{background:var(--bg);margin:28px auto;border-radius:26px;box-shadow:0 24px 70px rgba(0,0,0,.14);padding:24px 26px 34px;min-height:calc(100vh - 56px);max-width:540px}
  .wrap.wide{max-width:1120px}
  .daily,.btn,.chip,.opt,.tcard,.back,.snd{transition:transform .15s,box-shadow .15s,filter .15s,background .15s}
  .daily:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.18)}
  .btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}
  .chip:hover{border-color:var(--accent)}
  .opt:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
  .opt{position:relative}
  .opts .opt::after{content:attr(data-key);position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--hint);border:1px solid rgba(128,128,128,.35);border-radius:6px;padding:1px 6px;opacity:.8}
  .opts.kid .opt::after{display:none}
}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <section id="home" class="screen active"></section>
  <section id="game" class="screen"></section>
  <section id="result" class="screen"></section>
  <section id="ref" class="screen"></section>
  <section id="ach" class="screen"></section>
  <section id="resorts" class="screen"></section>
  <section id="kids" class="screen"></section>
  <section id="countries" class="screen"></section>
</div>
<div class="toast" id="toast"></div>
<div class="praise" id="praise"></div>
<div class="ach-banner" id="achBanner"></div>

<script>

// Равномерная выборка: регионы чередуются по кругу, чтобы «весь мир» не превращался в «одну Африку»
function balanced(list, rnd = Math.random) {
  const groups = {};
  list.forEach(c => { (groups[c.r] = groups[c.r] || []).push(c); });
  const queues = shuffle(Object.keys(groups), rnd).map(r => shuffle(groups[r], rnd));
  const out = [];
  while (queues.some(q => q.length)) {
    shuffle(queues, rnd).forEach(q => { if (q.length) out.push(q.pop()); });
  }
  return out;
}

const norm = s => String(s).toLowerCase().replace(/ё/g, 'е').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zа-я0-9]/g, '');
function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

  }
  return prev[n];
}

function checkTyped(typed, c, what) {
  const a = norm(typed);
  if (!a) return false;
  const targets = (what === 'c' ? [c.ru.c, c.en.c] : [c.ru.n, c.en.n]).concat(ALIASES[c.id + ':' + what] || []);
  let res = false;
  for (const t of targets) {
    const b = norm(t);
    if (a === b) return 'exact';
    const tol = b.length <= 4 ? 0 : b.length <= 8 ? 1 : 2;
    if (lev(a, b) <= tol) res = 'close';
  }
  return res;
}

let game = null, timerId = null;

function buildQuestions(pool, rnd) {
  return pool.map(c => {
    let cand = shuffle(COUNTRIES.filter(x => x.r === c.r && x.id !== c.id), rnd);
    if (cand.length < 3) cand = cand.concat(shuffle(COUNTRIES.filter(x => x.r !== c.r), rnd));
    return { c, opts: shuffle([c, ...cand.slice(0, 3)], rnd).map(o => o.id) };
  });
}
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function endGame() { stopTimer(); if (game) game.over = true; game = null; }

async function startGame(kind) {
  const t = T();
  let rnd = Math.random, mode = settings.mode, type = settings.type, base;
  if (kind === 'daily') { mode = 'c2cap'; type = 'normal'; }
  if (kind === 'errors') type = 'normal';

  if (mode === 'shape') {
    go('game');
    $('#game').innerHTML = `<div class="loading">${t.loadingShapes}</div>`;
    try { await loadGeo(); } catch (e) { toast(t.shapesFail); go('home'); return; }
    if (!$('#game').classList.contains('active')) return; // ушли, пока грузилось
  }

  if (kind === 'daily') {
    rnd = mulberry32(parseInt(todayKey().replace(/-/g, ''), 10));
    base = balanced(COUNTRIES, rnd).slice(0, 10);
  } else if (kind === 'errors') {
    base = shuffle(mistakes.map(id => BY_ID[id]).filter(Boolean)).slice(0, 20);
  } else {
    base = balanced(selPool());
  }
  if (mode === 'shape') base = base.filter(c => shapeOK(c.id));
  let pool = base;
  if (kind === 'normal' && type !== 'blitz' && settings.len !== 'all') pool = base.slice(0, settings.len);
  if (!pool.length) { go('home'); return; }

  game = {
    kind, mode, type, key: bestKey(), base, qs: buildQuestions(pool, rnd),
    i: 0, asked: 0, score: 0, streak: 0, maxStreak: 0, wrong: [], hintUsed: false, locked: false,
    xp: 0, rank0: rankIdx(stats.xp), newAch: [], over: false
  };
  go('game');
  game.t0 = Date.now();
  if (type === 'blitz') {
    game.deadline = Date.now() + 60000;
    timerId = setInterval(tickBlitz, 100);
  } else {
    timerId = setInterval(tickClock, 500);
  }
  renderQuestion();
}

function tickBlitz() {
  if (!game || game.over) return stopTimer();
  const left = Math.max(0, game.deadline - Date.now());
  const tt = $('#timerTxt'), tb = $('#timerBar');
  if (tt) tt.textContent = '⏱ ' + Math.ceil(left / 1000);
  if (tb) { tb.style.width = (left / 600) + '%'; tb.classList.toggle('low', left < 10000); }
  if (left <= 0) { praise(T().timeUp, 'mega'); finish(); }
}

function tickClock() {
  if (!game || game.over) return stopTimer();
  const el = $('#clockTxt');
  if (el) el.textContent = '⏱ ' + fmtTime(Date.now() - game.t0);
}

function gameTitle() {
  const t = T();
  if (game.kind === 'daily') return t.dailyTitle;
  if (game.kind === 'errors') return t.errorsTitle;
  const pre = game.type === 'blitz' ? '⚡ ' : game.type === 'hardcore' ? '💀 ' : '';
  return pre + regTitle();
}
const askWhat = () => game.mode === 'c2cap' ? 'c' : 'n'; // что нужно назвать: столицу или страну

function renderQuestion() {
  const t = T(), q = game.qs[game.i], c = q.c, n = game.qs.length;
  const label = o => game.mode === 'c2cap' ? cp(o) : nm(o);
  let qHtml;
  if (game.mode === 'c2cap') qHtml = `${flag(c.id, 'big')}<small>${t.qc2cap} ${tierTag(c)}</small><h2>${esc(nm(c))}</h2>`;
  else if (game.mode === 'cap2c') qHtml = `<div class="fl big">🏛️</div><small>${t.qcap2c} ${tierTag(c)}</small><h2>${esc(cp(c))}</h2>`;
  else qHtml = `${shapeSVG(c.id)}<small>${t.qshape} ${tierTag(c)}</small>`;

  const answers = hard
    ? `<form class="hard" id="hardForm" autocomplete="off">

         <button class="btn" type="submit">${t.answerBtn}</button>

       <div class="hard-hint" id="hardHint"></div>`
    : `<div class="opts">${q.opts.map((id, k) => `<button class="opt" data-key="${k + 1}" data-act="opt" data-id="${id}">${esc(label(BY_ID[id]))}</button>`).join('')}</div>`;

  const hintBtn = hard
    ? `<button class="link" data-act="hint" ${game.hintUsed ? 'disabled' : ''}>${t.hintBtn}</button>`
    : `<button class="link" data-act="hint" ${game.hintUsed ? 'disabled' : ''}>💡 50/50</button>`;

  $('#game').innerHTML = `
    <div class="top"><span>${gameTitle()}</span><span>${topRight}</span></div>
    ${bar}
    <div class="top"><span>✅ ${game.score} · ⭐ ${game.xp} XP</span><span>${game.streak >= 3 ? '🔥' : '⚡'} ${t.streak}: ${game.streak}</span></div>
    <div class="q">${qHtml}</div>
    ${answers}
    <div class="reveal" id="reveal"></div>
    <div class="tools">
      <button class="link" data-act="quit">✕ ${t.quit}</button>
      ${hard ? `<button class="link" data-act="skip">${t.dontKnow}</button>` : ''}
      ${hintBtn}
    </div>`;
  game.locked = false;
  if (hard) {
    $('#hardForm').addEventListener('submit', e => { e.preventDefault(); answerTyped($('#hardIn').value); });
    setTimeout(() => { const i = $('#hardIn'); if (i) i.focus(); }, 50);
  }
}

// Общая обработка ответа: ok — верно ли, close — засчитано с опечаткой
function resolve(ok, close) {
  const t = T(), q = game.qs[game.i];
  let gain = 0;
  game.asked++;
  stats.answered++;
  if (ok) {
    game.score++; game.streak++; stats.correct++;
    game.maxStreak = Math.max(game.maxStreak, game.streak);
    stats.bestStreak = Math.max(stats.bestStreak, game.streak);
    mistakes = mistakes.filter(x => x !== q.c.id);
    if (!stats.known.includes(q.c.id)) stats.known.push(q.c.id);
    if (game.mode === 'shape') stats.shapeOk++;
    gain = Math.round((game.type === 'hardcore' ? 20 : game.type === 'blitz' ? 5 : 10) * mult(q.c)); // опыт = база × сложность (в блице половина)
    game.xp += gain; stats.xp += gain;
    const milestone = game.streak === 3 || (game.streak >= 5 && game.streak % 5 === 0);
    if (milestone) {
      praise(t.streakMsg(game.streak), 'mega');
      confetti(45); sfx('mega'); hapticImpact('heavy');
    } else {
      praise(close ? t.almost : t.praise[Math.floor(Math.random() * t.praise.length)]);
      confetti(game.type === 'blitz' ? 6 : 14); sfx('ok'); haptic('success');
    }
  } else {
    game.streak = 0;
    game.wrong.push(q.c.id);
    if (!mistakes.includes(q.c.id)) mistakes.push(q.c.id);
    sfx('bad'); haptic('error');
    if (game.type === 'blitz') { game.deadline -= 3000; praise(t.penalty, 'minus'); }
  }
  $('#reveal').innerHTML = `${flag(q.c.id, 'sm')} <b>${esc(cp(q.c))}</b> — ${t.capOf} ${esc(nm(q.c))}${gain ? ` <span class="gain">+${gain} XP</span>` : ''}`;
  checkAch(game);
  saveAll();
  const delay = game.type === 'blitz' ? (ok ? 350 : 1000) : (ok ? 900 : 1900);
  setTimeout(nextQuestion, delay);
}

function answer(id) {
  if (!game || game.locked) return;
  game.locked = true;
  const q = game.qs[game.i], ok = id === q.c.id;
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.id === q.c.id) b.classList.add('ok');
    else if (b.dataset.id === id) b.classList.add('bad');
  });
  resolve(ok, false);
}

function answerTyped(text) {
  if (!game || game.locked) return;
  if (!norm(text)) { const i = $('#hardIn'); if (i) i.focus(); return; }
  game.locked = true;
  const q = game.qs[game.i], res = checkTyped(text, q.c, askWhat());
  const inp = $('#hardIn');
  inp.readOnly = true;
  inp.classList.add(res ? 'ok' : 'bad');
  if (!res) inp.value = `${T().youTyped}: ${text}`;
  resolve(!!res, res === 'close');
}

function skipTyped() {
  if (!game || game.locked) return;
  game.locked = true;
  const inp = $('#hardIn');
  if (inp) { inp.readOnly = true; inp.classList.add('bad'); }
  resolve(false, false);
}

function useHint() {
  if (!game || game.hintUsed || game.locked) return;
  // Сюда позже можно повесить показ рекламы (Adsgram) за подсказку
  game.hintUsed = true;
  const q = game.qs[game.i];
  if (game.type === 'hardcore') {
    const ans = askWhat() === 'c' ? cp(q.c) : nm(q.c);
    $('#hardHint').textContent = T().hintLetter(ans[0].toUpperCase(), ans.replace(/[\s\-—'’.,]/g, '').length);
  } else {
    const wrong = shuffle(q.opts.filter(id => id !== q.c.id)).slice(0, 2);
    document.querySelectorAll('.opt').forEach(b => { if (wrong.includes(b.dataset.id)) { b.classList.add('gone'); b.disabled = true; } });
  }
  document.querySelector('[data-act="hint"]').disabled = true;
}

function nextQuestion() {
  if (!game || game.over) return;
  game.i++;
  if (game.i >= game.qs.length) {
    if (game.type === 'blitz') game.qs = game.qs.concat(buildQuestions(balanced(game.base), Math.random)); // в блице вопросы не кончаются
    else return finish();
  }
  renderQuestion();
}

function finish() {
  if (!game || game.over) return;
  game.over = true;
  stopTimer();
  game.time = Date.now() - game.t0;
  stats.played++;
  let record = false, best = null, fastRec = false;
  if (game.type !== 'blitz' && !game.wrong.length && game.asked > 0) {
    const tk = game.kind === 'daily' ? 'daily' : game.key;
    const prevT = stats.bestTime[tk];
    if (prevT == null || game.time < prevT) { fastRec = prevT != null; stats.bestTime[tk] = game.time; }
    game.bestTime = stats.bestTime[tk];
  } else if (game.type !== 'blitz') {
    game.bestTime = stats.bestTime[game.kind === 'daily' ? 'daily' : game.key];
  }
  if (game.kind === 'normal') {
    const prev = stats.best[game.key] || 0;
    if (game.score > prev) { stats.best[game.key] = game.score; record = game.score > 0; }
    best = stats.best[game.key];
    if (game.type === 'blitz') stats.blitzBest = Math.max(stats.blitzBest, game.score);
  }
  if (game.kind === 'daily') {
    const k = todayKey();
    if (stats.daily[k] == null) stats.daily[k] = game.score;
    const keys = Object.keys(stats.daily).sort();
    while (keys.length > 30) delete stats.daily[keys.shift()];
  }
  checkAch(game);
  saveAll();
  const rankUp = rankIdx(stats.xp) > game.rank0;
  renderResult(record, best, rankUp, fastRec);
  go('result');
  const total = game.type === 'blitz' ? Math.max(game.asked, 1) : game.qs.length;
  if (record || rankUp || fastRec || game.score / total >= 0.7) {
    setTimeout(() => { confetti(rankUp ? 140 : 90); sfx('win'); haptic('success'); }, 250);
  }
}

function renderResult(record, best, rankUp, fastRec) {
  const t = T(), blitz = game.type === 'blitz';
  const n = blitz ? game.asked : game.qs.length;
  const pct = n ? Math.round(game.score / n * 100) : 0;
  const emoji = blitz ? (game.score >= 25 ? '🌩️' : game.score >= 15 ? '⚡' : '⏱️') : pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : pct >= 40 ? '👍' : '📚';
  const uniqWrong = [...new Set(game.wrong)];
  const list = uniqWrong.length
    ? `<div class="label">${t.mist}</div>` + uniqWrong.map(id => { const c = BY_ID[id]; return `<div class="item">${flag(id, 'sm')}<span>${esc(nm(c))}</span><span class="c">${esc(cp(c))}</span></div>`; }).join('')
    : `<div style="text-align:center">${t.noMist}</div>`;
  const achHtml = game.newAch.length
    ? `<div class="card"><div class="label">${t.achGot}</div><div class="ach-row">${game.newAch.map(a => `<span title="${esc(achText(a)[1])}">${a.i} ${esc(achText(a)[0])}</span>`).join('')}</div></div>`
    : '';
  $('#result').innerHTML = `
    <div class="top"><span>${gameTitle()}</span><span></span></div>
    <div class="emoji">${emoji}</div>
    <div class="big-score">${blitz ? game.score : `${game.score}/${n}`}</div>
    <div class="pct">${blitz ? `${t.answers}: ${n} · ${t.correctW}: ${game.score}` : `${pct}% · ${t.streak}: ${game.maxStreak}`}</div>
    ${blitz ? '' : `<div class="pct">${t.timeLine(fmtTime(game.time), (game.time / 1000 / Math.max(game.asked, 1)).toFixed(1).replace('.', settings.lang === 'ru' ? ',' : '.'))}</div>`}
    ${fastRec ? `<span class="badge">${t.newBestTime}</span>` : (!blitz && game.bestTime != null ? `<div class="pct">${t.bestTime}: ${fmtTime(game.bestTime)}</div>` : '')}
    <div class="xp-line">⭐ ${t.gotXp(game.xp)}</div>
    ${rankUp ? `<span class="badge">${t.newRank(rankName(rankIdx(stats.xp)))}</span>` : ''}
    ${record ? `<span class="badge">${t.newRecord}</span>` : best != null ? `<div class="pct">${t.best}: ${best}</div>` : ''}
    <button class="btn" data-act="share">📤 ${t.share}</button>
    <div class="row">
      <button class="btn sec" data-act="again">↻ ${t.again}</button>
      ${game.kind === 'normal' ? `<button class="btn sec" data-act="countries">🌍 ${t.toCountries}</button>` : `<button class="btn sec" data-act="home">${t.home}</button>`}
    </div>
    ${achHtml}
    <div class="card">${list}</div>`;
}

function share() {
  const t = T();
  const tm = game.time ? t.shareTime(fmtTime(game.time)) : '';
  const text = game.res ? t.shareRes(game.score, game.qs.length, tm)
    : game.kind === 'daily' ? t.shareDaily(game.score, tm)
    : game.type === 'blitz' ? t.shareBlitz(game.score)
    : t.shareText(game.score, game.qs.length, tm);
  if (inTg) {
    tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(APP_LINK)}&text=${encodeURIComponent(text)}`);
  } else if (navigator.share) {
    navigator.share({ text, url: APP_LINK }).catch(() => {});
  } else {
    try { navigator.clipboard.writeText(text + ' ' + APP_LINK); toast(t.copied); } catch (e) {}
  }
}

// --- игра «Где этот курорт?» ---
function buildResQuestions(pool) {
  return pool.map(r => {
    // неправильные варианты — страны соседних курортов (та же подгруппа → то же направление → любые)
    const pick = f => shuffle([...new Set(RESORTS.filter(f).map(x => x.c))]);
    const cand = [...new Set([
      ...pick(x => x.sub === r.sub && x.c !== r.c),
      ...pick(x => x.g === r.g && x.c !== r.c),
      ...pick(x => x.c !== r.c)
    ])].slice(0, 3);
    return { r, opts: shuffle([r.c, ...cand]) };
  });
}

// равномерно по подгруппам — чтобы «все направления» не были одним Египтом
function balancedRes(list) {
  const groups = {};
  list.forEach(r => { (groups[r.sub] = groups[r.sub] || []).push(r); });
  const queues = shuffle(Object.keys(groups)).map(k => shuffle(groups[k]));
  const out = [];
  while (queues.some(q => q.length)) shuffle(queues).forEach(q => { if (q.length) out.push(q.pop()); });
  return out;
}

function loadScript(urls) {

async function fetchJSON(urls) {

function isoOf(p) {
  const bad = v => !v || v === '-99' || v === -99;
  if (!bad(p.ISO_A2)) return p.ISO_A2;
  if (!bad(p.ISO_A2_EH)) return p.ISO_A2_EH;

const FEAT = {};

function loadGeo() {
  if (!geoPromise) {
    geoPromise = fetchJSON(GEO_URLS).then(geo => {
      geo.features.forEach(f => {
        f.__id = isoOf(f.properties);
        if (f.__id && BY_ID[f.__id] && !FEAT[f.__id]) { hasPoly.add(f.__id); FEAT[f.__id] = f; }
      });
      return geo;
    }).catch(e => { geoPromise = null; throw e; });
  }

}

// Силуэт страны в SVG (для режима «Контур»)
const shapeCache = {};
function shapeParts(id) {
  if (shapeCache[id] !== undefined) return shapeCache[id];
  const f = FEAT[id];
  if (!f) return (shapeCache[id] = null);
  const g = f.geometry;
  const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
  let minL = Infinity, maxL = -Infinity;
  polys.forEach(p => p.forEach(r => r.forEach(pt => { minL = Math.min(minL, pt[0]); maxL = Math.max(maxL, pt[0]); })));
  const wrap = maxL - minL > 180; // страна пересекает 180-й меридиан (Россия, Фиджи)
  const P = polys.map(p => p.map(r => r.map(([lo, la]) => [wrap && lo < 0 ? lo + 360 : lo, la])));
  const info = P.map(p => {
    const r = p[0]; let a = 0, cx = 0, cy = 0;
    for (let i = 0; i < r.length; i++) { const [x1, y1] = r[i], [x2, y2] = r[(i + 1) % r.length]; a += x1 * y2 - x2 * y1; cx += x1; cy += y1; }
    return { p, area: Math.abs(a) / 2, cx: cx / r.length, cy: cy / r.length };
  });
  const big = info.reduce((m, x) => x.area > m.area ? x : m);
  // убираем далёкие мелкие владения (Аляска, Гвиана у Франции и т.п.)
  const keep = info.filter(x => x.area >= big.area * 0.3 || Math.hypot(x.cx - big.cx, x.cy - big.cy) <= 30);
  let pts = 0;
  keep.forEach(x => x.p.forEach(r => { pts += r.length; }));
  return (shapeCache[id] = { keep, pts });
}
const shapeOK = id => { const s = shapeParts(id); return !!(s && s.pts >= 10); };
function shapeSVG(id) {
  const s = shapeParts(id);
  if (!s) return '';
  let minLa = Infinity, maxLa = -Infinity;
  s.keep.forEach(x => x.p.forEach(r => r.forEach(pt => { minLa = Math.min(minLa, pt[1]); maxLa = Math.max(maxLa, pt[1]); })));
  const k = Math.cos((minLa + maxLa) / 2 * Math.PI / 180);
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, d = '';
  s.keep.forEach(x => x.p.forEach(r => {
    d += 'M' + r.map(([lo, la]) => {
      const X = lo * k, Y = -la;
      minX = Math.min(minX, X); maxX = Math.max(maxX, X); minY = Math.min(minY, Y); maxY = Math.max(maxY, Y);
      return X.toFixed(3) + ' ' + Y.toFixed(3);
    }).join('L') + 'Z';
  }));
  const w = maxX - minX, h = maxY - minY, pad = Math.max(w, h) * 0.06;
  return `<svg class="shape" viewBox="${(minX - pad).toFixed(3)} ${(minY - pad).toFixed(3)} ${(w + 2 * pad).toFixed(3)} ${(h + 2 * pad).toFixed(3)}" preserveAspectRatio="xMidYMid meet"><path d="${d}" fill-rule="evenodd"/></svg>`;
}
function polyColor(f) {
  if (f.properties.ADM0_A3 === 'ATA') return 'rgba(236,243,250,0.95)'; // Антарктида — белый лёд
  if (f.__id && f.__id === refSel) return '#ff8a00';
  const c = BY_ID[f.__id];
  if (!c) return 'rgba(150,160,155,0.5)';
  if (refRegion !== 'world' && c.r !== refRegion) return 'rgba(150,160,155,0.5)';
  return '#45b36f';
}
function polyLabel(f) {
  const c = BY_ID[f.__id];
  return c ? `<div class="glabel">${esc(nm(c))}<br><b>${esc(cp(c))}</b></div>` : '';
}
function updateGlobe() {
  if (!globe) return;
  globe
    .polygonCapColor(f => polyColor(f))
    .polygonAltitude(f => f.__id && f.__id === refSel ? 0.05 : 0.008)
    .htmlElementsData(refSel ? [{ id: refSel }] : []);
}
function flyTo(id) {
  if (!globe || !GEO[id]) return;
  globe.controls().autoRotate = false;
  globe.pointOfView({ lat: GEO[id][0], lng: GEO[id][1], altitude: hasPoly.has(id) ? 1.3 : 0.7 }, 1000);
}
function flyRegion(r) {
  if (!globe) return;
  globe.controls().autoRotate = r === 'world' && !refSel;
  globe.pointOfView(REGION_VIEW[r], 1000);
}

async function initGlobe() {
  if (globe || globeLoading) return;
  globeLoading = true;
  try {
    await loadScript(GLOBE_JS);
    const geo = await loadGeo();
    const feats = geo.features;
    const box = $('#globeBox');
    globe = Globe()(box)
      .width(box.clientWidth || 360).height(box.clientHeight || 300)
      .backgroundColor('rgba(0,0,0,0)')
      .showAtmosphere(true).atmosphereColor('#7cc4ff').atmosphereAltitude(0.18)
      .polygonsData(feats)
      .polygonSideColor(() => 'rgba(0,0,0,0.2)')
      .polygonStrokeColor(() => 'rgba(255,255,255,0.35)')
      .polygonLabel(f => polyLabel(f))
      .polygonsTransitionDuration(300)
      .onPolygonClick(f => { if (f.__id && BY_ID[f.__id]) pickCountry(f.__id, 'globe'); })
      .htmlLat(d => GEO[d.id][0]).htmlLng(d => GEO[d.id][1]).htmlAltitude(0.06)
      .htmlElement(d => {
        const el = document.createElement('div');
        el.className = 'pin';
        el.innerHTML = `<b>📍 ${esc(cp(BY_ID[d.id]))}</b>`;
        return el;
      });
    try { globe.globeMaterial().color.set('#1f5a96'); } catch (e) {}
    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.5;
    const msg = $('#globeMsg'); if (msg) msg.remove();
    updateGlobe();
    if (refSel) flyTo(refSel); else globe.pointOfView(REGION_VIEW[refRegion], 0);
    if (!$('#ref').classList.contains('active')) globe.pauseAnimation();
  } catch (e) {
    const msg = $('#globeMsg'); if (msg) msg.textContent = T().globeFail;
  } finally {
    globeLoading = false;
  }
}
function resizeGlobe() {
  if (!globe) return;
  const box = $('#globeBox');
  if (box.clientWidth && box.clientHeight) globe.width(box.clientWidth).height(box.clientHeight);
}
window.addEventListener('resize', resizeGlobe);
if (tg && tg.onEvent) { try { tg.onEvent('viewportChanged', resizeGlobe); } catch (e) {} }

const isWide = () => window.matchMedia('(min-width:768px)').matches;
let trayT = null, trayMuteUntil = 0;
const trayMute = ms => { trayMuteUntil = Date.now() + (ms || 500); };
function centerCard(id, smooth) {
  const tray = $('#reflist'), el = tray.querySelector(`[data-id="${id}"]`);
  if (!el) return;
  if (isWide()) { el.scrollIntoView({ block: 'nearest', behavior: smooth ? 'smooth' : 'auto' }); return; }
  // на узком экране листается вся страница, а глобус закреплён сверху — прокручиваем так, чтобы строка была под глобусом
  const gh = $('.ref-globe').offsetHeight;
  const r = el.getBoundingClientRect();
  if (r.top < gh + 8 || r.bottom > window.innerHeight) {
    window.scrollTo({ top: window.scrollY + r.top - gh - 60, behavior: smooth ? 'smooth' : 'auto' });
  }
}

function renderRef() {
  const t = T();
  if (!refBuilt) {
    $('#ref').innerHTML = `
      <header><button class="back" data-act="home" id="refBack"></button><h1 id="refTitle"></h1></header>
      <div class="ref-layout">
        <div class="ref-globe"><div class="globe-box" id="globeBox"><div class="globe-msg" id="globeMsg"></div></div></div>
        <div class="ref-side">
          <div class="sel-card" id="selCard"></div>
          <div class="chips" id="refChips"></div>
          <input class="search" id="refq">
          <div class="tray" id="reflist"></div>
        </div>
      </div>`;
    $('#refq').addEventListener('input', e => { refQuery = e.target.value; fillRef(); });
    refBuilt = true;
  }
  $('#refTitle').textContent = '📖 ' + t.ref;
  $('#refBack').textContent = '‹ ' + t.back;
  $('#refq').placeholder = t.search;
  const msg = $('#globeMsg'); if (msg && !globe) msg.textContent = t.globeLoading;
  renderRefChips(); renderSel(); fillRef(); updateGlobe();
  initGlobe();
}
function renderRefChips() {
  const t = T();
  $('#refChips').innerHTML = REGIONS.map(r => `<button class="chip ${refRegion === r ? 'on' : ''}" data-act="refreg" data-v="${r}">${t[r]}</button>`).join('');
}
function renderSel() {
  const t = T();
  if (!refSel) { $('#selCard').innerHTML = `<span style="color:var(--hint)">👆 ${t.globeHint}</span>`; return; }
  const c = BY_ID[refSel];
  $('#selCard').innerHTML = `${flag(c.id, 'md')}<div><b>${esc(nm(c))}</b><div style="color:var(--hint);font-size:14px;margin-top:2px">${t.capital}: <b style="color:var(--text)">${esc(cp(c))}</b> · ${t[c.r]}</div></div>`;
}
function fillRef() {
  const q = refQuery.trim().toLowerCase();
  const items = inRegion(refRegion)
    .filter(c => !q || [c.en.n, c.en.c, c.ru.n, c.ru.c].some(s => s.toLowerCase().includes(q)))
    .sort((a, b) => nm(a).localeCompare(nm(b), settings.lang));
  const tray = $('#reflist');
  tray.innerHTML = items.length
    ? items.map(c => `<div class="tcard ${c.id === refSel ? 'sel' : ''}" data-act="pick" data-id="${c.id}">${flag(c.id, 'md')}<b>${esc(nm(c))}</b><span>${esc(cp(c))}</span></div>`).join('')
    : '<div class="tray-empty">—</div>';
  tray.scrollTop = 0;
}
function pickCountry(id, src) {
  if (id === refSel && src === 'scroll') return;
  refSel = id;
  $('#reflist').querySelectorAll('.tcard').forEach(e => e.classList.toggle('sel', e.dataset.id === id));
  renderSel(); updateGlobe(); flyTo(id);
  try { if (tgv('6.1')) tg.HapticFeedback.selectionChanged(); } catch (e) {}
  if (src === 'globe') centerCard(id, true); // тапнули на глобусе — подкручиваем список к стране
}

// ===== ОБРАБОТКА НАЖАТИЙ =====
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === 'lang') { settings.lang = v; settings.langManual = true; document.documentElement.lang = v; saveAll(); renderHome(); }
  else if (a === 'set') { settings[el.dataset.k] = (el.dataset.k === 'len' && v !== 'all') ? Number(v) : v; saveAll(); renderCountries(); }
  else if (a === 'sound') { settings.sound = !settings.sound; saveAll(); renderHome(); sfx('ok'); }
  else if (a === 'reg') { toggleRegion(v); saveAll(); renderCountries(); }
  else if (a === 'countries') { endGame(); renderCountries(); go('countries'); }
  else if (a === 'start') startGame('normal');
  else if (a === 'daily') startGame('daily');
  else if (a === 'errors') startGame('errors');
  else if (a === 'ref') { renderRef(); go('ref'); }
  else if (a === 'refreg') { refRegion = v; refSel = null; renderRefChips(); renderSel(); fillRef(); updateGlobe(); flyRegion(v); }
  else if (a === 'pick') pickCountry(el.dataset.id, 'tap');
  else if (a === 'opt') answer(el.dataset.id);
  else if (a === 'hint') useHint();
  else if (a === 'skip') skipTyped();
  else if (a === 'kids') { endGame(); kgame = null; renderKids(); go('kids'); }
  else if (a === 'kstart') startKids(v);
  else if (a === 'kopt') answerKids(el.dataset.id);
  else if (a === 'kquit') { if (kgame) kgame.over = true; kgame = null; renderKids(); go('kids'); }
  else if (a === 'resorts') { endGame(); renderResorts(); go('resorts'); }
  else if (a === 'rset') { settings[el.dataset.k] = (el.dataset.k === 'rlen' && v !== 'all') ? Number(v) : v; saveAll(); renderResorts(); }
  else if (a === 'rstart') startResort();
  else if (a === 'ropt') answerRes(el.dataset.id);
  else if (a === 'rhint') useResHint();
  else if (a === 'ach') { renderAch(); go('ach'); }
  else if (a === 'quit' && game && game.kind === 'normal') { endGame(); renderCountries(); go('countries'); }
  else if (a === 'quit' || a === 'home') { endGame(); go('home'); }
  else if (a === 'again') { if (game && game.res) { startResort(); } else { const k = game ? game.kind : 'normal'; endGame(); startGame(k); } }
  else if (a === 'share') share();
});

// Клавиатура на компьютере: 1–4 — выбрать вариант, Esc — назад
document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') { if (e.key === 'Escape') e.target.blur(); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4 && $('#game').classList.contains('active')) {
    const btn = document.querySelectorAll('#game .opt')[n - 1];
    if (btn && !btn.disabled) { btn.click(); e.preventDefault(); }
  } else if (e.key === 'Escape') {
    const back = document.querySelector('.screen.active .back') || document.querySelector('.screen.active [data-act="quit"]') || document.querySelector('.screen.active [data-act="kquit"]');
    if (back) back.click();
  }
});

document.documentElement.lang = settings.lang;
renderHome();
</script>
</body>
