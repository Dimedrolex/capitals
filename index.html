<style>
:root{
  --bg: var(--tg-theme-bg-color,#ffffff);
  --bg2: var(--tg-theme-secondary-bg-color,#f1f3f6);
  --text: var(--tg-theme-text-color,#111418);
  --hint: var(--tg-theme-hint-color,#8a8f98);
  --accent: var(--tg-theme-button-color,#2f7cf6);
  --accent-text: var(--tg-theme-button-text-color,#ffffff);
  --ok:#22a55a; --bad:#e5484d;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg: var(--tg-theme-bg-color,#16181c);
    --bg2: var(--tg-theme-secondary-bg-color,#23262c);
    --text: var(--tg-theme-text-color,#f2f3f5);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:inherit}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.screen{display:none}.screen.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
h1{font-size:24px;line-height:1.2}
.sub{color:var(--hint);font-size:14px;margin-top:4px}
.lang{display:flex;background:var(--bg2);border-radius:10px;padding:3px;flex-shrink:0}
.lang button{border:0;background:none;color:var(--hint);font-weight:700;padding:6px 10px;border-radius:8px;font-size:13px;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--accent-text)}
.card{background:var(--bg2);border-radius:16px;padding:14px;margin-bottom:12px}
.daily{display:block;width:100%;text-align:left;border:0;border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff8a00,#e52e71)}
.daily b{font-size:17px;display:block;margin-bottom:4px}.daily span{font-size:13px;opacity:.92}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--hint);margin:2px 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1.5px solid transparent;background:var(--bg);color:var(--text);padding:8px 12px;border-radius:20px;font-size:14px;cursor:pointer}
.chip small{color:var(--hint);font-size:11px;margin-left:2px}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.seg .chip{border-radius:12px;text-align:center;padding:11px 6px}
.best-line{font-size:13px;color:var(--hint)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-text);margin-bottom:10px}
.btn.sec{background:var(--bg2);color:var(--text)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:var(--hint)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--hint);margin-bottom:8px}
.bar{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q{text-align:center;margin:14px 0 22px}
.q small{color:var(--hint);font-size:14px;display:block;margin-top:10px}
.q h2{font-size:26px;margin-top:4px;line-height:1.25}
.fl{display:inline-block;line-height:1}
.fl img{display:block;border-radius:4px;object-fit:cover}
.fl.big{font-size:72px}.fl.big img{height:84px;width:auto;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.fl.sm{font-size:20px;vertical-align:middle}.fl.sm img{height:20px;width:30px}
.opts{display:grid;gap:10px}
.opt{border:0;background:var(--bg2);color:var(--text);padding:16px;border-radius:14px;font-size:17px;text-align:left;cursor:pointer;transition:transform .1s,background .15s}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--ok);color:#fff}
.opt.bad{background:var(--bad);color:#fff;animation:shake .3s}
.opt.gone{visibility:hidden}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.reveal{min-height:28px;text-align:center;margin-top:14px;font-size:15px;color:var(--hint)}
.tools{display:flex;justify-content:space-between;margin-top:8px}
.link{background:none;border:0;color:var(--accent);font-size:15px;font-weight:600;cursor:pointer;padding:8px}
.link:disabled{color:var(--hint);opacity:.5;cursor:default}
.big-score{font-size:60px;font-weight:800;text-align:center;line-height:1.1}
.pct{text-align:center;color:var(--hint);margin:6px 0 10px}
.badge{display:block;text-align:center;color:#ff8a00;font-weight:700;font-size:18px;margin-bottom:14px}
.emoji{font-size:56px;text-align:center;margin-top:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(128,128,128,.15);font-size:15px}
.item:last-child{border-bottom:0}
.item .c{margin-left:auto;color:var(--hint);text-align:right}
.search{width:100%;border:0;background:var(--bg2);color:var(--text);padding:13px 14px;border-radius:12px;font-size:16px;margin-bottom:12px;outline:none}
.hbtns{display:flex;gap:6px;align-items:center;flex-shrink:0}
.snd{border:0;background:var(--bg2);border-radius:10px;width:36px;height:34px;font-size:16px;cursor:pointer}
.opt.ok{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.05)}}
.praise{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);font-size:30px;font-weight:800;color:var(--ok);opacity:0;pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.18);white-space:nowrap;z-index:50}
.praise.mega{color:#ff8a00;font-size:38px}
.praise.go{animation:praise 1.1s ease-out forwards}
@keyframes praise{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}40%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
.cf{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:60;pointer-events:none;animation:fall var(--d) ease-in forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r))}}
/* --- справочник: мобильная раскладка (глобус сверху, лента карточек снизу) --- */
#ref.screen.active{display:flex;flex-direction:column;height:calc(var(--tg-viewport-stable-height,100vh) - 56px)}
#ref header{margin-bottom:4px}
#ref h1{font-size:20px}
.ref-layout{flex:1;display:flex;flex-direction:column;min-height:0}
.ref-globe{flex:1;min-height:220px;margin:0 -16px 6px;position:relative}
.globe-box{position:absolute;inset:0;overflow:hidden;touch-action:none}
.ref-side .sel-card{display:none}
.ref-side .chips{flex-wrap:nowrap;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.ref-side .chips::-webkit-scrollbar{display:none}
.ref-side .chip{flex-shrink:0}
.ref-side .search{padding:11px 14px;margin-bottom:8px}
.tray{position:relative;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px calc(50% - 75px) 8px;margin:0 -16px;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tcard{flex:0 0 150px;scroll-snap-align:center;background:var(--bg2);border-radius:14px;padding:12px 10px;text-align:center;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s,background .15s}
.tcard .fl{display:block}
.tcard .fl img{margin:0 auto 6px}
.tcard b{display:block;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard span{display:block;font-size:13px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tcard.sel{border-color:#ff8a00;transform:scale(1.05)}
.tray-empty{color:var(--hint);padding:20px;text-align:center;width:100%}
/* --- справочник: широкий экран (глобус слева, список справа) --- */
@media (min-width:768px){
  .wrap.wide{max-width:1100px}
  #ref.screen.active{display:block;height:auto}
  .ref-layout{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
  .ref-globe{position:sticky;top:16px;height:calc(100vh - 90px);margin:0;min-height:0}
  .ref-side .sel-card{display:flex}
  .ref-side .chips{flex-wrap:wrap;overflow:visible}
  .tray{flex-direction:column;overflow-x:hidden;overflow-y:auto;scroll-snap-type:none;margin:0;gap:0;padding:6px 10px;max-height:calc(100vh - 330px);background:var(--bg2);border-radius:16px}
  .tcard{flex:none;display:flex;align-items:center;gap:10px;text-align:left;background:none;border-radius:10px;padding:8px}
  .tcard .fl img{margin:0;height:20px;width:30px}
  .tcard b{flex:1;font-size:15px}
  .tcard span{margin:0;font-size:14px}
  .tcard.sel{transform:none;background:rgba(255,138,0,.16)}
}
.globe-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:14px;text-align:center;padding:20px}
.sel-card{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:14px;padding:12px;margin-bottom:12px;min-height:58px}
.fl.md img{height:30px;width:45px}
.pin{pointer-events:none;color:#fff;font-size:13px;white-space:nowrap;transform:translateY(-16px)}
.pin b{background:rgba(0,0,0,.6);padding:3px 8px;border-radius:10px}
.glabel{background:rgba(0,0,0,.78);color:#fff;padding:6px 10px;border-radius:8px;font-size:13px;line-height:1.4}
.item.clk{cursor:pointer}
.item.sel{background:rgba(255,138,0,.16);border-radius:10px;padding-left:8px;padding-right:8px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>

// Приводим старые/кривые настройки к новому формату (несколько регионов)

const $ = s => document.querySelector(s);

const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const emojiFlag = id => String.fromCodePoint(...[...id].map(ch => 127397 + ch.charCodeAt(0)));
function flag(id, cls) {
  const size = cls === 'big' ? 'w320' : 'w80';
  return `<span class="fl ${cls}"><img src="https://flagcdn.com/${size}/${id.toLowerCase()}.png" alt="" loading="lazy" onerror="this.parentNode.textContent='${emojiFlag(id)}'"></span>`;
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, rnd = Math.random) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const todayKey = () => new Date().toISOString().slice(0, 10);
const inRegion = r => r === 'world' ? COUNTRIES : COUNTRIES.filter(c => c.r === r);
const isWorld = () => PARTS.every(p => settings.regions.includes(p));

const regTitle = () => isWorld() ? T().world : PARTS.filter(p => settings.regions.includes(p)).map(p => T()[p]).join(' + ');

function toggleRegion(v) {
  if (v === 'world') { settings.regions = PARTS.slice(); return; }
  if (isWorld()) { settings.regions = [v]; return; }           // из «Весь мир» тап = только этот регион
  if (settings.regions.includes(v)) {
    settings.regions = settings.regions.filter(x => x !== v);
    if (!settings.regions.length) settings.regions = PARTS.slice(); // сняли всё — снова весь мир
  } else {
    settings.regions.push(v);                                       // выбрали все 6 — это и есть весь мир

}

function confetti(n) {
  const colors = ['#ff8a00', '#e52e71', '#2f7cf6', '#22a55a', '#ffd400', '#8b5cf6'];
  for (let i = 0; i < n; i++) {
    const d = document.createElement('i');
    d.className = 'cf';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.background = colors[i % colors.length];
    d.style.setProperty('--x', (Math.random() * 160 - 80) + 'px');
    d.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    d.style.setProperty('--d', (0.9 + Math.random() * 0.9) + 's');
    d.style.animationDelay = Math.random() * 0.25 + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2300);
  }
}
let actx = null;
function sfx(kind) {
  if (!settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const now = actx.currentTime;
    const play = (f, t, d, type = 'sine', v = 0.12) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now + t);
      g.gain.exponentialRampToValueAtTime(v, now + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + t + d);
      o.connect(g); g.connect(actx.destination);
      o.start(now + t); o.stop(now + t + d + 0.05);
    };
    if (kind === 'ok') { play(784, 0, .15); play(1047, .09, .25); }
    else if (kind === 'mega') { [523, 659, 784, 1047].forEach((f, i) => play(f, i * .09, i === 3 ? .4 : .15)); }
    else if (kind === 'bad') { play(220, 0, .25, 'triangle', .1); }
    else if (kind === 'win') { [523, 659, 784, 1047, 1319].forEach((f, i) => play(f, i * .1, .35)); }
  } catch (e) {}
}

// ===== ИГРА =====
let game = null;

function buildQuestions(pool, rnd) {
  return pool.map(c => {
    let cand = shuffle(COUNTRIES.filter(x => x.r === c.r && x.id !== c.id), rnd);
    if (cand.length < 3) cand = cand.concat(shuffle(COUNTRIES.filter(x => x.r !== c.r), rnd));
    return { c, opts: shuffle([c, ...cand.slice(0, 3)], rnd).map(o => o.id) };
  });
}

function startGame(kind) {
  let rnd = Math.random, pool, mode = settings.mode;
  if (kind === 'daily') {
    rnd = mulberry32(parseInt(todayKey().replace(/-/g, ''), 10));
    pool = shuffle(COUNTRIES, rnd).slice(0, 10);
    mode = 'c2cap';
  } else if (kind === 'errors') {
    pool = shuffle(mistakes.map(id => BY_ID[id]).filter(Boolean)).slice(0, 20);
  } else {
    pool = shuffle(selPool());
    if (settings.len !== 'all') pool = pool.slice(0, settings.len);
  }
  if (!pool.length) return;
  game = { kind, mode, key: bestKey(), qs: buildQuestions(pool, rnd), i: 0, score: 0, streak: 0, maxStreak: 0, wrong: [], hintUsed: false, locked: false };
  go('game');
  renderQuestion();
}

function gameTitle() {
  const t = T();
  return game.kind === 'daily' ? t.dailyTitle : game.kind === 'errors' ? t.errorsTitle : regTitle();
}

function renderQuestion() {
  const t = T(), q = game.qs[game.i], c = q.c, n = game.qs.length;
  const label = o => game.mode === 'c2cap' ? cp(o) : nm(o);
  const qHtml = game.mode === 'c2cap'
    ? `${flag(c.id, 'big')}<small>${t.qc2cap}</small><h2>${esc(nm(c))}</h2>`
    : `<div class="fl big">🏛️</div><small>${t.qcap2c}</small><h2>${esc(cp(c))}</h2>`;
  $('#game').innerHTML = `
    <div class="top"><span>${gameTitle()}</span><span>${game.i + 1} / ${n}</span></div>
    <div class="bar"><i style="width:${game.i / n * 100}%"></i></div>
    <div class="top"><span>✅ ${game.score}</span><span>${game.streak >= 3 ? '🔥' : '⚡'} ${t.streak}: ${game.streak}</span></div>
    <div class="q">${qHtml}</div>
    <div class="opts">${q.opts.map(id => `<button class="opt" data-act="opt" data-id="${id}">${esc(label(BY_ID[id]))}</button>`).join('')}</div>
    <div class="reveal" id="reveal"></div>
    <div class="tools">
      <button class="link" data-act="quit">✕ ${t.quit}</button>
      <button class="link" data-act="hint" ${game.hintUsed ? 'disabled' : ''}>💡 50/50</button>
    </div>`;
  game.locked = false;
}

function answer(id) {
  if (game.locked) return;
  game.locked = true;
  const t = T(), q = game.qs[game.i], ok = id === q.c.id;
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.id === q.c.id) b.classList.add('ok');
    else if (b.dataset.id === id) b.classList.add('bad');
  });
  stats.answered++;
  if (ok) {
    game.score++; game.streak++; stats.correct++;
    game.maxStreak = Math.max(game.maxStreak, game.streak);
    mistakes = mistakes.filter(x => x !== q.c.id);
    const milestone = game.streak === 3 || (game.streak >= 5 && game.streak % 5 === 0);
    if (milestone) {
      praise(t.streakMsg(game.streak), true);
      confetti(45); sfx('mega'); hapticImpact('heavy');
    } else {
      praise(t.praise[Math.floor(Math.random() * t.praise.length)]);
      confetti(14); sfx('ok'); haptic('success');
    }
  } else {
    game.streak = 0;
    game.wrong.push(q.c.id);
    if (!mistakes.includes(q.c.id)) mistakes.push(q.c.id);
    sfx('bad'); haptic('error');
  }
  $('#reveal').innerHTML = `${flag(q.c.id, 'sm')} <b>${esc(cp(q.c))}</b> — ${t.capOf} ${esc(nm(q.c))}`;
  saveAll();
  setTimeout(nextQuestion, ok ? 900 : 1900);
}

function useHint() {
  if (game.hintUsed || game.locked) return;
  // Сюда позже можно повесить показ рекламы (Adsgram) за подсказку
  game.hintUsed = true;
  const q = game.qs[game.i];
  const wrong = shuffle(q.opts.filter(id => id !== q.c.id)).slice(0, 2);
  document.querySelectorAll('.opt').forEach(b => { if (wrong.includes(b.dataset.id)) { b.classList.add('gone'); b.disabled = true; } });
  document.querySelector('[data-act="hint"]').disabled = true;
}

function nextQuestion() {
  if (!game) return;
  game.i++;
  if (game.i >= game.qs.length) finish(); else renderQuestion();
}

function finish() {
  const n = game.qs.length;
  stats.played++;
  stats.bestStreak = Math.max(stats.bestStreak, game.maxStreak);
  let record = false, best = null;
  if (game.kind === 'normal') {
    const prev = stats.best[game.key] || 0;
    if (game.score > prev) { stats.best[game.key] = game.score; record = true; }
    best = stats.best[game.key];
  }
  if (game.kind === 'daily') {
    const k = todayKey();
    if (stats.daily[k] == null) stats.daily[k] = game.score;
    const keys = Object.keys(stats.daily).sort();
    while (keys.length > 30) delete stats.daily[keys.shift()];
  }
  saveAll();
  renderResult(record, best);
  go('result');
  if (record || game.score / n >= 0.7) {
    setTimeout(() => { confetti(90); sfx('win'); haptic('success'); }, 250);
  }
}

function renderResult(record, best) {
  const t = T(), n = game.qs.length, pct = Math.round(game.score / n * 100);
  const emoji = pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : pct >= 40 ? '👍' : '📚';
  const list = game.wrong.length
    ? `<div class="label">${t.mist}</div>` + game.wrong.map(id => { const c = BY_ID[id]; return `<div class="item">${flag(id, 'sm')}<span>${esc(nm(c))}</span><span class="c">${esc(cp(c))}</span></div>`; }).join('')
    : `<div style="text-align:center">${t.noMist}</div>`;
  $('#result').innerHTML = `
    <div class="top"><span>${gameTitle()}</span><span></span></div>
    <div class="emoji">${emoji}</div>
    <div class="big-score">${game.score}/${n}</div>
    <div class="pct">${pct}% · ${t.streak}: ${game.maxStreak}</div>
    ${record ? `<span class="badge">${t.newRecord}</span>` : best != null ? `<div class="pct">${t.best}: ${best}</div>` : ''}
    <button class="btn" data-act="share">📤 ${t.share}</button>
    <div class="row">
      <button class="btn sec" data-act="again">↻ ${t.again}</button>
      <button class="btn sec" data-act="home">${t.home}</button>
    </div>
    <div class="card">${list}</div>`;
}

function share() {
  const t = T();
  const text = game.kind === 'daily' ? t.shareDaily(game.score) : t.shareText(game.score, game.qs.length);
  if (inTg) {
    tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(APP_LINK)}&text=${encodeURIComponent(text)}`);
  } else if (navigator.share) {
    navigator.share({ text, url: APP_LINK }).catch(() => {});
  } else {
    try { navigator.clipboard.writeText(text + ' ' + APP_LINK); toast(t.copied); } catch (e) {}
  }
}

const GEO = Object.fromEntries(GEO_RAW.trim().split(/\s+/).map(s => { const [id, la, lo] = s.split('|'); return [id, [+la, +lo]]; }));

const GLOBE_JS = [
  'https://cdn.jsdelivr.net/npm/globe.gl@2.27/dist/globe.gl.min.js',
  'https://unpkg.com/globe.gl@2.27/dist/globe.gl.min.js'
];
const GEO_URLS = [
  'https://cdn.jsdelivr.net/gh/vasturiano/globe.gl@master/example/datasets/ne_110m_admin_0_countries.geojson',
  'https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson'
];
const REGION_VIEW = {
  world: { lat: 25, lng: 30, altitude: 2.3 }, eu: { lat: 50, lng: 15, altitude: 1.3 },
  as: { lat: 30, lng: 90, altitude: 1.9 }, af: { lat: 3, lng: 20, altitude: 1.7 },
  na: { lat: 28, lng: -90, altitude: 1.8 }, sa: { lat: -18, lng: -60, altitude: 1.6 },
  oc: { lat: -15, lng: 160, altitude: 1.9 }
};

let refRegion = 'world', refQuery = '', refSel = null, refBuilt = false;
let globe = null, globeLoading = false;
const hasPoly = new Set();

function loadScript(urls) {
  return new Promise((res, rej) => {
    let i = 0;
    const next = () => {
      if (i >= urls.length) return rej(new Error('script'));
      const s = document.createElement('script');
      s.src = urls[i++]; s.onload = res; s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
}
async function fetchJSON(urls) {
  for (const u of urls) { try { const r = await fetch(u); if (r.ok) return await r.json(); } catch (e) {} }
  throw new Error('geo');
}
function isoOf(p) {
  const bad = v => !v || v === '-99' || v === -99;
  if (!bad(p.ISO_A2)) return p.ISO_A2;
  if (!bad(p.ISO_A2_EH)) return p.ISO_A2_EH;
  return ({ FRA: 'FR', NOR: 'NO' })[p.ADM0_A3] || null;
}
function polyColor(f) {
  if (f.properties.ADM0_A3 === 'ATA') return 'rgba(236,243,250,0.95)'; // Антарктида — белый лёд
  if (f.__id && f.__id === refSel) return '#ff8a00';
  const c = BY_ID[f.__id];
  if (!c) return 'rgba(150,160,155,0.5)';
  if (refRegion !== 'world' && c.r !== refRegion) return 'rgba(150,160,155,0.5)';
  return '#45b36f';
}
function polyLabel(f) {
  const c = BY_ID[f.__id];
  return c ? `<div class="glabel">${esc(nm(c))}<br><b>${esc(cp(c))}</b></div>` : '';
}
function updateGlobe() {
  if (!globe) return;
  globe
    .polygonCapColor(f => polyColor(f))
    .polygonAltitude(f => f.__id && f.__id === refSel ? 0.05 : 0.008)
    .htmlElementsData(refSel ? [{ id: refSel }] : []);
}
function flyTo(id) {
  if (!globe || !GEO[id]) return;
  globe.controls().autoRotate = false;
  globe.pointOfView({ lat: GEO[id][0], lng: GEO[id][1], altitude: hasPoly.has(id) ? 1.3 : 0.7 }, 1000);
}
function flyRegion(r) {
  if (!globe) return;
  globe.controls().autoRotate = r === 'world' && !refSel;
  globe.pointOfView(REGION_VIEW[r], 1000);
}

async function initGlobe() {
  if (globe || globeLoading) return;
  globeLoading = true;
  try {
    await loadScript(GLOBE_JS);
    const geo = await fetchJSON(GEO_URLS);
    const feats = geo.features;
    feats.forEach(f => { f.__id = isoOf(f.properties); if (f.__id && BY_ID[f.__id]) hasPoly.add(f.__id); });
    const box = $('#globeBox');
    globe = Globe()(box)
      .width(box.clientWidth || 360).height(box.clientHeight || 300)
      .backgroundColor('rgba(0,0,0,0)')
      .showAtmosphere(true).atmosphereColor('#7cc4ff').atmosphereAltitude(0.18)
      .polygonsData(feats)
      .polygonSideColor(() => 'rgba(0,0,0,0.2)')
      .polygonStrokeColor(() => 'rgba(255,255,255,0.35)')
      .polygonLabel(f => polyLabel(f))
      .polygonsTransitionDuration(300)
      .onPolygonClick(f => { if (f.__id && BY_ID[f.__id]) pickCountry(f.__id, 'globe'); })
      .htmlLat(d => GEO[d.id][0]).htmlLng(d => GEO[d.id][1]).htmlAltitude(0.06)
      .htmlElement(d => {
        const el = document.createElement('div');
        el.className = 'pin';
        el.innerHTML = `<b>📍 ${esc(cp(BY_ID[d.id]))}</b>`;
        return el;
      });
    try { globe.globeMaterial().color.set('#1f5a96'); } catch (e) {}
    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.5;
    const msg = $('#globeMsg'); if (msg) msg.remove();
    updateGlobe();
    if (refSel) flyTo(refSel); else globe.pointOfView(REGION_VIEW[refRegion], 0);
    if (!$('#ref').classList.contains('active')) globe.pauseAnimation();
  } catch (e) {
    const msg = $('#globeMsg'); if (msg) msg.textContent = T().globeFail;
  } finally {
    globeLoading = false;
  }
}
function resizeGlobe() {
  if (!globe) return;
  const box = $('#globeBox');
  if (box.clientWidth && box.clientHeight) globe.width(box.clientWidth).height(box.clientHeight);
}
window.addEventListener('resize', resizeGlobe);
if (tg && tg.onEvent) { try { tg.onEvent('viewportChanged', resizeGlobe); } catch (e) {} }

const isHoriz = () => !window.matchMedia('(min-width:768px)').matches;
let trayT = null, trayMuteUntil = 0;
const trayMute = ms => { trayMuteUntil = Date.now() + (ms || 500); };
function centerCard(id, smooth) {
  const tray = $('#reflist'), el = tray.querySelector(`[data-id="${id}"]`);
  if (!el) return;
  if (isHoriz()) tray.scrollTo({ left: el.offsetLeft - (tray.clientWidth - el.offsetWidth) / 2, behavior: smooth ? 'smooth' : 'auto' });
  else el.scrollIntoView({ block: 'nearest', behavior: smooth ? 'smooth' : 'auto' });
}
// Карточка, остановившаяся по центру ленты, автоматически выбирается
function onTrayScrollEnd() {
  if (!isHoriz() || Date.now() < trayMuteUntil) return;
  const tray = $('#reflist'), mid = tray.scrollLeft + tray.clientWidth / 2;
  let best = null, bd = Infinity;
  tray.querySelectorAll('.tcard').forEach(e => {
    const d = Math.abs(e.offsetLeft + e.offsetWidth / 2 - mid);
    if (d < bd) { bd = d; best = e; }
  });
  if (best) pickCountry(best.dataset.id, 'scroll');
}

function renderRef() {
  const t = T();
  if (!refBuilt) {
    $('#ref').innerHTML = `
      <header><h1 id="refTitle"></h1></header>
      <div class="ref-layout">
        <div class="ref-globe"><div class="globe-box" id="globeBox"><div class="globe-msg" id="globeMsg"></div></div></div>
        <div class="ref-side">
          <div class="sel-card" id="selCard"></div>
          <div class="chips" id="refChips"></div>
          <input class="search" id="refq">
          <div class="tray" id="reflist"></div>
        </div>
      </div>`;
    $('#refq').addEventListener('input', e => { refQuery = e.target.value; fillRef(); });
    $('#reflist').addEventListener('scroll', () => { clearTimeout(trayT); trayT = setTimeout(onTrayScrollEnd, 130); }, { passive: true });
    refBuilt = true;
  }
  $('#refTitle').textContent = '📖 ' + t.ref;
  $('#refq').placeholder = t.search;
  const msg = $('#globeMsg'); if (msg && !globe) msg.textContent = t.globeLoading;
  renderRefChips(); renderSel(); fillRef(); updateGlobe();
  initGlobe();
}
function renderRefChips() {
  const t = T();
  $('#refChips').innerHTML = REGIONS.map(r => `<button class="chip ${refRegion === r ? 'on' : ''}" data-act="refreg" data-v="${r}">${t[r]}</button>`).join('');
}
function renderSel() {
  const t = T();
  if (!refSel) { $('#selCard').innerHTML = `<span style="color:var(--hint)">👆 ${t.globeHint}</span>`; return; }
  const c = BY_ID[refSel];
  $('#selCard').innerHTML = `${flag(c.id, 'md')}<div><b>${esc(nm(c))}</b><div style="color:var(--hint);font-size:14px;margin-top:2px">${t.capital}: <b style="color:var(--text)">${esc(cp(c))}</b> · ${t[c.r]}</div></div>`;
}
function fillRef() {
  const q = refQuery.trim().toLowerCase();
  const items = inRegion(refRegion)
    .filter(c => !q || [c.en.n, c.en.c, c.ru.n, c.ru.c].some(s => s.toLowerCase().includes(q)))
    .sort((a, b) => nm(a).localeCompare(nm(b), settings.lang));
  const tray = $('#reflist');
  trayMute(600);
  tray.innerHTML = items.length
    ? items.map(c => `<div class="tcard ${c.id === refSel ? 'sel' : ''}" data-act="pick" data-id="${c.id}">${flag(c.id, 'md')}<b>${esc(nm(c))}</b><span>${esc(cp(c))}</span></div>`).join('')
    : '<div class="tray-empty">—</div>';
  tray.scrollLeft = 0; tray.scrollTop = 0;
  if (refSel && items.some(c => c.id === refSel)) centerCard(refSel, false);
}
function pickCountry(id, src) {
  if (id === refSel && src === 'scroll') return;
  refSel = id;
  $('#reflist').querySelectorAll('.tcard').forEach(e => e.classList.toggle('sel', e.dataset.id === id));
  renderSel(); updateGlobe(); flyTo(id);
  try { if (tgv('6.1')) tg.HapticFeedback.selectionChanged(); } catch (e) {}
  if (src !== 'scroll') { trayMute(700); centerCard(id, true); }
}

// ===== ОБРАБОТКА НАЖАТИЙ =====
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === 'lang') { settings.lang = v; document.documentElement.lang = v; saveAll(); renderHome(); }
  else if (a === 'set') { settings[el.dataset.k] = (el.dataset.k === 'len' && v !== 'all') ? Number(v) : v; saveAll(); renderHome(); }
  else if (a === 'sound') { settings.sound = !settings.sound; saveAll(); renderHome(); sfx('ok'); }
  else if (a === 'reg') { toggleRegion(v); saveAll(); renderHome(); }
  else if (a === 'start') startGame('normal');
  else if (a === 'daily') startGame('daily');
  else if (a === 'errors') startGame('errors');
  else if (a === 'ref') { renderRef(); go('ref'); }
  else if (a === 'refreg') { refRegion = v; renderRefChips(); fillRef(); updateGlobe(); flyRegion(v); }
  else if (a === 'pick') pickCountry(el.dataset.id, 'tap');
  else if (a === 'opt') answer(el.dataset.id);
  else if (a === 'hint') useHint();
  else if (a === 'quit' || a === 'home') { game = null; go('home'); }
  else if (a === 'again') startGame(game.kind);
  else if (a === 'share') share();
});

document.documentElement.lang = settings.lang;
renderHome();
</script>
